# Veröffentlicht das Repository auf GitHub Pages im selben Aufbau wie die Auslieferung aus dem Branch:
# Startseite index.html leitet nach web/ weiter, die Anwendung liegt unter web/. So gelten dieselben Adressen,
# egal ob Pages auf "GitHub Actions" oder "Deploy from a branch" steht (früher lud dieser Workflow nur web/ hoch;
# liefen beide Wege gleichzeitig, fehlte je nach Reihenfolge /web/ und die Seite zeigte 404).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
